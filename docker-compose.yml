services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: smartcab
      POSTGRES_PASSWORD: smartcab_dev
      POSTGRES_DB: smartcab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcab -d smartcab"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: